<!DOCTYPE html>
<html>
    <style>
        caption {
            caption-side: bottom;
            padding: 10px;
        }

        h1 {
            font-size: 2vw;
            background: pink;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 3vw;
            border: 3px solid pink; 
        }

        p, a, select, input {
            font-size: 0.8vw;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.75vw;
        }

        .container > div {
            flex: 1; /*grow*/
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        div {
            vertical-align:top;
            justify-content: center;
            align-items: center;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        td, th, tr {
            width: 33%;
            text-align: center;
            font-size: 1.1vw;
            vertical-align: top;
            border: 1px solid rgb(160 160 160);
            padding: 8px 10px;
        }

        table {
            float: center;
            vertical-align: top;
            border-collapse: collapse;
            border: 2px solid black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
    </style>
    <head>
        <h1>Stratification Diagrams for (q-2, 2)</h1>
        <script src="https://d3js.org/d3.v7.min.js"></script>
    </head>
    <body>
        <!-- IMPORT JAVASCRIPT-->
        <script src="stratification_functions.js"></script>

        <a href="index.html">Back to the Kraft Diagram Database</a>

        <p>
        Choose a q to display:
        <input type="number" id="q" name="q" min="2" max="20" onchange="draw_stratification_diagram()">
        </p>

        <div id="draw_diagram" style="vertical-align: top;"></div> 

    </body>
</html>
