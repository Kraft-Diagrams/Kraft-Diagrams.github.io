<!DOCTYPE html>
<html>
    <style>
       th, td {
        border: 1px solid rgb(160 160 160);
        padding: 8px 10px;
        }

        th[scope="col"] {
            background-color: #505050;
            color: white;
        }

        th[scope="row"] {
            background-color: #d6ecd4;
        }

        td {
            text-align: center;
        }

        tr:nth-of-type(even) {
            background-color: #eeeeee;
        }

        table {
            border-collapse: collapse;
            border: 2px solid rgb(140 140 140);
            font-family: sans;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        caption {
            caption-side: bottom;
            padding: 10px;
        }
    </style>
    <head>
        <h1>Kraft Diagram Database</h1>
        <script src="https://d3js.org/d3.v7.min.js"></script>
    </head>
    <body>
        <!-- IMPORT JAVASCRIPT-->
        <script src="database_functions.js"></script>

        <!-- FILTER THE DATA -->
        <!-- Filter by Dimension -->
        <form id="filter">
        <p>Sort by Dimension: q 
        <select name="q_filter" id="q_filter" onchange="filter_data()">
            <option value="eq" selected="selected">=</option>
            <option value="le">&le;</option>
            <option value="ge">&ge;</option>
        </select>
        <select name="q" id="q" onchange="filter_data()">
            <option value="all">All q</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected="selected">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        </p>

        <p>Sort by Signature: (q-b, b) 
        <select name="b" id="b" onchange="filter_data()">
            <option value="all" selected="selected">All Signatures</option>
            <option value="0">b = 0</option>
            <option value="1">b = 1</option>
            <option value="2">b = 2</option>
            <option value="3">b = 3</option>
            <option value="4">b = 4</option>
            <option value="5">b = 5</option>
            <option value="6">b = 6</option>
            <option value="7">b = 7</option>
            <option value="8">b = 8</option>
            <option value="9">b = 9</option>
            <option value="10">b = 10</option>
        </select>
        </p>

        <p>
        Indecomposible?
        <input type="checkbox" id="indecomposible" onchange="filter_data()">
        </p>

        <p>
            Interaction with the SS Locus
            <select name="SS Locus" id="SS Locus" onchange="filter_data()">
                <option value="all" selected="selected">All Interactions</option>
                <option value="Disjoint">Disjoint</option>
                <option value="Contained In">Contained In</option>
                <option value="Intersects">Intersects</option>
                <option value="Unknown">Unknown</option>
            </select>
        </p>

        <p><input type="reset" onclick="filter_data()"/></p>
        </form>

        <!-- Create a table to store all of the strata information -->
        <table id="strata">
            <thead>
            <tr>
                <th>Dimension q</th>
                <th>Signature</th>
                <th>Strata</th>
                <th>Word(s)</th>
                <th>EO Type</th>
                <th>Hirashita Slope</th>
                <th>TL Slope</th>
                <th>Indecomposible</th>
                <th>SS Locus</th>
                <th>Kraft Diagram</th>
            </tr>
            </thead>
            <tbody id="strata-body">
            </tbody>
        </table>

        <div id="plot_graph">
            
        </div>

    </body>
</html>
