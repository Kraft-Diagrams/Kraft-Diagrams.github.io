<!DOCTYPE html>
<html>
    <style>
       th, td {
        border: 1px solid rgb(160 160 160);
        padding: 8px 10px;
        }

        th[scope="col"] {
            background-color: #505050;
            color: white;
        }

        th[scope="row"] {
            background-color: #d6ecd4;
        }

        td {
            text-align: center;
        }

        tr:nth-of-type(even) {
            background-color: #eeeeee;
        }

        table {
            border-collapse: collapse;
            border: 2px solid rgb(140 140 140);
            font-family: sans;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        caption {
            caption-side: bottom;
            padding: 10px;
        }
    </style>
    <head>
        <h1>Kraft Diagram Database</h1>
    </head>
    <body>

        <!-- FILTER THE DATA -->
        <!-- Filter by Dimension -->
        <p>Sort by Dimension: q 
        <select name="q_filter" id="q_filter" onchange="filter_data()">
            <option value="eq" selected="selected">=</option>
            <option value="le">&le;</option>
            <option value="ge">&ge;</option>
        </select>
        <select name="q" id="q" onchange="filter_data()">
            <option value="all">All q</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected="selected">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        </p>

        <p>Sort by Signature: (q-b, b) 
        <select name="b" id="b" onchange="filter_data()">
            <option value="all" selected="selected">All Signatures</option>
            <option value="1">b = 1</option>
            <option value="2">b = 2</option>
            <option value="3">b = 3</option>
            <option value="4">b = 4</option>
            <option value="5">b = 5</option>
            <option value="6">b = 6</option>
            <option value="7">b = 7</option>
            <option value="8">b = 8</option>
            <option value="9">b = 9</option>
            <option value="10">b = 10</option>
        </select>
        </p>

        <p>
        Indecomposible?
        <input type="checkbox" id="indecomposible" onchange="filter_data()">
        </p>


        <!-- Create a table to store all of the strata information -->
        <table id="strata">
            <thead>
            <tr>
                <th>Dimension q</th>
                <th>Signature</th>
                <th>Strata</th>
                <th>Word(s)</th>
                <th>EO Type</th>
                <th>Hirashita Slope</th>
                <th>TL Slope</th>
                <th>Indecomposible</th>
            </tr>
            </thead>
            <tbody id="strata-body">
            </tbody>
        </table>

        <table>

        <!-- BEGIN JAVASCRIPT -->
        <script>

            filter_data();

            // Grab, parse, and return the information from the JSON file
            async function getData() {
                const response = await fetch("All_Strata.json");
                const data = await response.json();

                return data;
            }

            async function filter_data() {

                // Get the data we'll be filtering
                const strata = await getData();

                var table_body = document.getElementById("strata-body");

                // Delete what is currently in the table, because we are going to replace it
                var tr = table_body.querySelectorAll("tr");
                table_body.innerHTML = "";

                // Filter elements based on their dimension (q)
                filtered_strata = strata.filter(function(element) {
                    var q = document.getElementById("q").value;
                    var comp_q = document.getElementById("q_filter").value;

                    if (q == "all") {
                        return true;
                    }
                    if (comp_q == "eq") {
                        if (element.q.toString() == q) {
                            return true;
                        }
                    } else if (comp_q == "le") {
                        if (element.q.toString() <= q) {
                            return true;
                        }
                    } else if (comp_q == "ge") {
                        if (element.q.toString() >= q) {
                            return true;
                        }
                    }
                    return false;
                });

                // Filter elements based on signature (a, b)
                filtered_strata = filtered_strata.filter(function(element){
                    var b = document.getElementById("b").value;

                    if (b == "all") {
                        return true;
                    }
                    if (element.Signature[1].toString() == b) {
                        return true;
                    }
                    return false;
                });

                // Filter based on whether it is indecomposible
                filtered_strata = filtered_strata.filter(function(element){
                    if (document.getElementById("indecomposible").checked && element.Indecomposible.toString() == "true") {
                        return true;
                    } else if (document.getElementById("indecomposible").checked && element.Indecomposible.toString() == "false") {
                        return false;
                    }
                    return true;
                });

                
                for (s of filtered_strata) {
                    let new_row = `
                    <tr>
                        <td>${s.q.toString()}</td>
                        <td>(${s.Signature.toString().split(',').join(', ')})</td>
                        <td>${s.Strata.toString().split(',').join(', ')}</td>
                        <td>${s.Words.join(', ')}</td>
                        <td>[${s.EO_Type.toString().split(',').join(', ')}]</td>
                        <td>${s.Hirashita_Slope.toString().split(',').join('/')}</td>
                        <td>[${s.TL_Slope.toString()}]</td>
                        <td>${s.Indecomposible}</td>
                    </tr>`;
                    table_body.insertAdjacentHTML("beforeend", new_row);
                }

            }
        </script>
        <!-- END JAVASCRIPT -->

    </body>
</html>
